[package]
name = "p1mplayer"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6.0.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
lofty = "0.24.0"
rand = "0.10.1"
rfd = "0.17.2"
rodio = "0.22.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
slint = { version = "1.16.1", features = ["unstable-winit-030"] }
souvlaki = "0.8.3"
walkdir = "2.5.0"

[build-dependencies]
slint-build = "1.16.1"
